name: CI

on:
  push:
    branches: [ "main", "phase*/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: TestBox specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install CommandBox
        run: |
          curl -fsSl https://downloads.ortussolutions.com/debs/gpg | sudo gpg --dearmor -o /usr/share/keyrings/ortussolutions.gpg
          echo "deb [signed-by=/usr/share/keyrings/ortussolutions.gpg] https://downloads.ortussolutions.com/debs/noarch /" | sudo tee /etc/apt/sources.list.d/commandbox.list
          sudo apt-get update
          sudo apt-get install -y apt-transport-https commandbox

      - name: Install dependencies (TestBox)
        run: box install

      - name: Download runtime dependencies (SQLite JDBC driver)
        run: bash scripts/install-deps.sh

      - name: Start CI server (Lucee 6)
        run: box server start serverConfigFile=server-ci.json

      - name: Run TestBox specs
        run: box testbox run runner="http://localhost:8599/tests/runner.cfm" verbose=true

      - name: Stop CI server
        if: always()
        run: box server stop serverConfigFile=server-ci.json || true
