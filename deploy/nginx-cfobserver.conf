# /etc/nginx/sites-available/cfobserver  (symlink into sites-enabled)
# Public TLS front door. The app itself is bound to 127.0.0.1:8888 and is never
# exposed directly. /tasks/ is hard-blocked here so the scheduler's local calls
# are the ONLY way those endpoints can run.

server {
	listen 80;
	listen [::]:80;
	server_name cfobserver.duckdns.org;

	# Allow certbot HTTP-01 challenges, redirect everything else to HTTPS.
	location /.well-known/acme-challenge/ { root /var/www/html; }
	location / { return 301 https://$host$request_uri; }
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name cfobserver.duckdns.org;

	ssl_certificate     /etc/letsencrypt/live/cfobserver.duckdns.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/cfobserver.duckdns.org/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;

	# Never expose internal task triggers to the public.
	location ^~ /tasks/ { return 404; }

	location / {
		proxy_pass http://127.0.0.1:8888;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# Tag every proxied (public) request so the app can reject /tasks/ even
		# if this location block is ever misconfigured. Defense in depth.
		proxy_set_header X-Public-Request  1;
		proxy_read_timeout 300s;
	}
}
